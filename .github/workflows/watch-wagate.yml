# Every ~10 minutes: ask the site to check wagate; the site alerts the owner in Telegram if it is down.
name: Watch wagate
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 90 https://ember-court.vercel.app/api/watch || true
