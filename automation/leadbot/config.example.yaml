# Настройка бота под клиента. Скопируйте в config.yaml и поменяйте тексты.
company: "Складской учёт Плюс"
language: ru

texts:
  start: |
    Здравствуйте! Это бот компании «Складской учёт Плюс».
    Оставьте заявку за минуту, и менеджер свяжется с вами в рабочее время.
  ask_service: "Что вас интересует?"
  ask_name: "Как к вам обращаться?"
  ask_contact: "Оставьте телефон кнопкой ниже или напишите удобный контакт (почта, Telegram)."
  share_phone: "Отправить телефон"
  ask_comment: "Коротко опишите задачу. Можно пропустить."
  skip: "Пропустить"
  confirm: "Проверьте заявку:"
  send: "Отправить"
  restart: "Заполнить заново"
  done: "Спасибо! Заявка принята. Ответим в течение рабочего дня."
  faq_title: "Частые вопросы:"
  too_fast: "Вы уже отправили заявку. Если нужно что-то добавить, просто напишите сюда."
  new_lead: "Новая заявка"
  addition: "Дополнение к заявке"

services:
  - "Внедрение программы"
  - "Обучение сотрудников"
  - "Поддержка"
  - "Другое"

faq:
  - q: "Сколько стоит?"
    a: "От 15 000 ₽ за внедрение. Точную цену назовём после короткого звонка."
  - q: "Сколько длится внедрение?"
    a: "Обычно 1-2 недели."

# Куда отправлять заявки (любые из пунктов можно убрать)
sinks:
  csv: "data/leads.csv"
  # Google Таблица: URL веб-приложения Apps Script (см. README)
  google_sheets_webhook: ""
  # Любой вебхук CRM: заявка уходит POST-запросом в JSON
  webhook: ""

# Приём заявок с сайта: POST /lead с заголовком X-Lead-Token
web:
  enabled: true
  port: 8080
  allowed_origin: "*"        # адрес сайта, например "https://example.com"
  trust_proxy: false         # true, только если бот стоит за nginx/Caddy (тогда IP берётся из X-Forwarded-For)
